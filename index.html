<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Mi primer Web AR</title>

    <!-- 1. Cargamos A-Frame (motor 3D) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 2. Cargamos AR.js (realidad aumentada) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin:0; overflow:hidden;">

    <!-- 3. La escena AR -->
    <a-scene embedded arjs>

      <a-assets>
        <!-- Cargamos el modelo GLTF (es más eficiente que OBJ) -->
        <a-asset-item id="casa" src="small_house._hut._barn/scene.gltf"></a-asset-item>
      </a-assets>

      <!-- 4. El marcador: cuando la cámara lo ve, muestra lo que está adentro -->
      <a-marker preset="hiro">

        <!-- 5. El objeto 3D: el modelo de la casa -->
        <a-entity
          gltf-model="#casa"
          position="0 0 0"
          scale="0.005 0.005 0.005"
          rotation="0 0 0"
          animation="property: rotation;
                     to: 0 360 0;
                     loop: true;
                     dur: 10000">
        </a-entity>

      </a-marker>

      <!-- 6. La cámara del mundo real -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
