<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Mi primer Web AR</title>

    <!-- 1. Cargamos A-Frame (motor 3D) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 2. Cargamos AR.js (realidad aumentada) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin:0; overflow:hidden;">

    <!-- 3. La escena AR -->
    <a-scene embedded arjs>

      <!-- 4. El marcador: cuando la cámara lo ve, muestra lo que está adentro -->
      <a-marker preset="hiro">

        <!-- 5. El objeto 3D: un cubo rojo -->
        <a-box
          position="0 0.5 0"
          rotation="0 45 0"
          color="#D85A30"
          animation="property: rotation;
                     to: 0 405 0;
                     loop: true;
                     dur: 3000">
        </a-box>

      </a-marker>

      <!-- 6. La cámara del mundo real -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
