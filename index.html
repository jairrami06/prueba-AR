<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Mi primer Web AR</title>

    <!-- 1. Cargamos A-Frame (motor 3D) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 2. Cargamos AR.js (realidad aumentada) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <!-- 2.1 Cargamos el script para gestos (pellizcar para redimensionar) -->
    <script src="https://raw.githack.com/fcor/aframe-gesture-detector-component/master/dist/aframe-gesture-detector.component.min.js"></script>
    <script src="https://raw.githack.com/fcor/aframe-gesture-handler-component/master/dist/aframe-gesture-handler.component.min.js"></script>
    <!-- Cargamos nipplejs para el joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
      AFRAME.registerComponent('center-model', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            // Centramos la geometría para que el pivote de rotación sea el centro real
            const box = new THREE.Box3().setFromObject(mesh);
            const center = new THREE.Vector3();
            box.getCenter(center);
            
            // En lugar de mover el mesh, movemos la geometría interna
            mesh.traverse(function (node) {
              if (node.isMesh) {
                node.geometry.center();
              }
            });
          });
        }
      });

      AFRAME.registerComponent('auto-scale', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // Calculamos la caja que envuelve el modelo
            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3());
            
            // Queremos que el lado más largo mida aproximadamente 1 unidad (tamaño del marcador)
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scale = 1.5 / maxDim; // 1.5 para que sobresalga un poco del marcador
              this.el.setAttribute('scale', { x: scale, y: scale, z: scale });
            }
          });
        }
      });

      // Lógica para el joystick de rotación
      window.onload = function() {
        const model = document.querySelector('#modelo-casa');
        let rotationY = 0;

        // Crear contenedor para joystick
        const joystickContainer = document.querySelector('#joystick-container');
        const joystick = nipplejs.create({
          zone: joystickContainer,
          mode: 'static',
          position: { left: '50%', top: '50%' },
          color: 'white',
          size: 100
        });

        joystick.on('move', (evt, data) => {
          if (data.vector && data.distance) {
            const currentRot = model.getAttribute('rotation');
            
            // Sensibilidad reducida para mayor control (menos DPI)
            // Bajamos de 8 a 1.5 para un movimiento más suave y preciso
            const sensitivity = 1.5; 

            // Rotación horizontal (Y)
            if (data.vector.x) {
              rotationY += data.vector.x * data.force * sensitivity;
            }

            // Rotación vertical (X)
            let rotationX = currentRot.x;
            if (data.vector.y) {
              rotationX -= data.vector.y * data.force * sensitivity; 
            }

            model.setAttribute('rotation', { x: rotationX, y: rotationY, z: currentRot.z });
          }
        });
      };
    </script>
  </head>

  <body style="margin:0; overflow:hidden;">
    <!-- Contenedor del Joystick central -->
    <div id="joystick-container" style="position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); width: 150px; height: 150px; z-index: 1000; pointer-events: auto;"></div>

    <!-- 3. La escena AR con detector de gestos -->
    <a-scene 
      embedded 
      arjs
      gesture-detector>

      <a-assets>
        <!-- Cargamos el nuevo modelo forest_hut.glb -->
        <a-asset-item id="casa" src="forest_hut.glb"></a-asset-item>
      </a-assets>

      <!-- 4. El marcador con el componente para que los gestos funcionen aquí -->
      <a-marker 
        preset="hiro"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
        id="marker">

        <!-- 5. El objeto 3D con la clase clickable y el componente gesture-handler -->
        <a-entity
          id="modelo-casa"
          class="clickable"
          gltf-model="#casa"
          position="0 0 0"
          rotation="0 0 0"
          gesture-handler="minScale: 0.25; maxScale: 10"
          auto-scale
          center-model>
        </a-entity>

      </a-marker>

      <!-- 6. La cámara del mundo real -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
