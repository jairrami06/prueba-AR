<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Mi primer Web AR</title>

    <!-- 1. Cargamos A-Frame (motor 3D) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 2. Cargamos AR.js (realidad aumentada) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <!-- 2.1 Cargamos el script para gestos (pellizcar para redimensionar) -->
    <script src="https://raw.githack.com/fcor/aframe-gesture-detector-component/master/dist/aframe-gesture-detector.component.min.js"></script>
    <script src="https://raw.githack.com/fcor/aframe-gesture-handler-component/master/dist/aframe-gesture-handler.component.min.js"></script>

    <script>
      AFRAME.registerComponent('auto-scale', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // Calculamos la caja que envuelve el modelo
            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3());
            
            // Queremos que el lado más largo mida aproximadamente 1 unidad (tamaño del marcador)
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scale = 1.5 / maxDim; // 1.5 para que sobresalga un poco del marcador
              this.el.setAttribute('scale', { x: scale, y: scale, z: scale });
            }
          });
        }
      });

      // Lógica para los botones de rotación
      window.onload = function() {
        const model = document.querySelector('#modelo-casa');
        const btnLeft = document.querySelector('#rotate-left');
        const btnRight = document.querySelector('#rotate-right');
        let rotationY = 90;

        btnLeft.addEventListener('click', () => {
          rotationY -= 15;
          const currentRot = model.getAttribute('rotation');
          model.setAttribute('rotation', { x: currentRot.x, y: rotationY, z: currentRot.z });
        });

        btnRight.addEventListener('click', () => {
          rotationY += 15;
          const currentRot = model.getAttribute('rotation');
          model.setAttribute('rotation', { x: currentRot.x, y: rotationY, z: currentRot.z });
        });
      };
    </script>
  </head>

  <body style="margin:0; overflow:hidden;">
    <!-- Controles de rotación -->
    <div style="position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 1000; display: flex; justify-content: center; gap: 10px;">
      <button id="rotate-left" style="padding: 15px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; cursor: pointer;">↺</button>
      <button id="rotate-right" style="padding: 15px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; cursor: pointer;">↻</button>
    </div>

    <!-- 3. La escena AR con detector de gestos -->
    <a-scene 
      embedded 
      arjs
      gesture-detector>

      <a-assets>
        <!-- Cargamos el modelo GLTF (es más eficiente que OBJ) -->
        <a-asset-item id="casa" src="small_house._hut._barn/scene.gltf"></a-asset-item>
      </a-assets>

      <!-- 4. El marcador con el componente para que los gestos funcionen aquí -->
      <a-marker 
        preset="hiro"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
        id="marker">

        <!-- 5. El objeto 3D con la clase clickable y el componente gesture-handler -->
        <a-entity
          id="modelo-casa"
          class="clickable"
          gltf-model="#casa"
          position="0 0 0"
          rotation="-90 90 0"
          gesture-handler="minScale: 0.25; maxScale: 10"
          auto-scale>
        </a-entity>

      </a-marker>

      <!-- 6. La cámara del mundo real -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
