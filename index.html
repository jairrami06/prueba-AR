<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Mi primer Web AR</title>

    <!-- 1. Cargamos A-Frame (motor 3D) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 2. Cargamos AR.js (realidad aumentada) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <!-- 2.1 Cargamos el script para gestos (pellizcar para redimensionar) -->
    <script src="https://raw.githack.com/fcor/aframe-gesture-detector-component/master/dist/aframe-gesture-detector.component.min.js"></script>
    <script src="https://raw.githack.com/fcor/aframe-gesture-handler-component/master/dist/aframe-gesture-handler.component.min.js"></script>
    <!-- Cargamos nipplejs para el joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
      AFRAME.registerComponent('adjust-model', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // 1. Calculamos el contenedor (bounding box) de todo el modelo
            const box = new THREE.Box3().setFromObject(obj);
            const size = new THREE.Vector3();
            box.getSize(size);
            const center = new THREE.Vector3();
            box.getCenter(center);

            // 2. Corregimos la posición para que no aparezca "en otro lugar"
            // Desplazamos el modelo interno para que su centro X,Z sea 0 
            // y su base (min.y) esté exactamente sobre el marcador.
            obj.position.x = -center.x;
            obj.position.z = -center.z;
            obj.position.y = -box.min.y; 

            // 3. Auto-escala: Ajustamos el tamaño al marcador (aprox 1.5 unidades)
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
              const scaleValue = 1.5 / maxDim;
              this.el.setAttribute('scale', { x: scaleValue, y: scaleValue, z: scaleValue });
            }
          });
        }
      });

      // Lógica para el joystick de rotación
      window.onload = function() {
        const model = document.querySelector('#modelo-casa');
        let rotationY = 90;

        // Crear contenedor para joystick
        const joystickContainer = document.querySelector('#joystick-container');
        const joystick = nipplejs.create({
          zone: joystickContainer,
          mode: 'static',
          position: { left: '50%', top: '50%' },
          color: 'white',
          size: 100
        });

        joystick.on('move', (evt, data) => {
          if (data.vector && data.distance) {
            const currentRot = model.getAttribute('rotation');
            
            // Sensibilidad reducida para mayor control (menos DPI)
            // Bajamos de 8 a 1.5 para un movimiento más suave y preciso
            const sensitivity = 1.5; 

            // Rotación horizontal (Y)
            if (data.vector.x) {
              rotationY += data.vector.x * data.force * sensitivity;
            }

            // Rotación vertical (X)
            let rotationX = currentRot.x;
            if (data.vector.y) {
              rotationX -= data.vector.y * data.force * sensitivity; 
            }

            model.setAttribute('rotation', { x: rotationX, y: rotationY, z: currentRot.z });
          }
        });
      };
    </script>
  </head>

  <body style="margin:0; overflow:hidden;">
    <!-- Overlay de texto informativo (oculto por defecto) -->
    <div id="info-overlay" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
        background-color: white; color: black; padding: 10px 20px; border-radius: 8px; 
        font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; 
        z-index: 2000; box-shadow: 0px 4px 6px rgba(0,0,0,0.3); text-align: center; width: 80%;
        display: none;">
      Información del Objeto: Escultura Valdivia
    </div>

    <script>
      // Lógica para mostrar/ocultar el texto al detectar el marcador
      window.addEventListener('load', () => {
        const marker = document.querySelector('#marker');
        const infoOverlay = document.querySelector('#info-overlay');

        marker.addEventListener('markerFound', () => {
          infoOverlay.style.display = 'block';
        });

        marker.addEventListener('markerLost', () => {
          infoOverlay.style.display = 'none';
        });
      });
    </script>

    <!-- Contenedor del Joystick central -->
    <div id="joystick-container" style="position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); width: 150px; height: 150px; z-index: 1000; pointer-events: auto;"></div>

    <!-- 3. La escena AR con detector de gestos -->
    <a-scene 
      embedded
      arjs="debugUIEnabled: false; logarithmicDepthBuffer: true;"
      renderer="antialias: true; precision: medium; alpha: true; sortObjects: true;"
      gesture-detector>

      <a-assets>
        <a-asset-item id="casa" src="valdivia.glb"></a-asset-item>
      </a-assets>

      <!-- 4. El marcador con el componente para que los gestos funcionen aquí -->
      <a-marker 
        preset="hiro"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
        id="marker">

        <!-- 5. El objeto 3D con la clase clickable y el componente gesture-handler -->
        <a-entity
          id="modelo-casa"
          class="clickable"
          gltf-model="#casa"
          position="0 0 0"
          rotation="0 -90 90"
          gesture-handler="minScale: 0.25; maxScale: 10"
          adjust-model>
        </a-entity>

      </a-marker>

      <!-- 6. La cámara del mundo real -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
